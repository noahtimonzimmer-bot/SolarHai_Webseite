# Cache-Regeln fuer solarhai.ch
#
# Ohne diese Regeln schickt nginx gar kein Cache-Control. Browser cachen die
# Dateien dann nach eigenem Ermessen und fragen den Server tagelang nicht mehr
# — auf dem Handy erscheinen Aenderungen deshalb erst viel spaeter als am
# Rechner mit offenen Entwicklerwerkzeugen.
#
# In den server{}-Block der Website einfuegen, danach:
#   sudo nginx -t && sudo systemctl reload nginx

# HTML: nie ungeprueft aus dem Cache. Der Browser fragt jedes Mal nach und
# bekommt bei unveraenderter Datei ein schnelles 304 zurueck.
location ~* \.html$ {
    add_header Cache-Control "no-cache";
}

# Das gilt auch fuer die Startseite, die ohne Dateiendung aufgerufen wird.
location = / {
    add_header Cache-Control "no-cache";
}

# CSS und JS: ein Jahr cachen. Die Seiten haengen ein ?v=... an die Adresse,
# eine neue Fassung bekommt also eine neue Adresse und wird sofort geladen.
location ~* \.(css|js)$ {
    add_header Cache-Control "public, max-age=31536000";
}

# Bilder, Videos und Schriften aendern sich selten und tragen feste Namen.
location ~* \.(jpg|jpeg|png|avif|webp|svg|mp4|woff2)$ {
    add_header Cache-Control "public, max-age=2592000";
}
